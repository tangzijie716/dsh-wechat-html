# dsh-wechat-html —— 排版半边（无凭据）
#
# 只做一件事：markdown → 微信公众号可直接用的内联样式 HTML。
# 与投递半边 dsh-wechat-push 完全独立，两边都装、都开即可；
# 单独装这一个也能用（把生成的 HTML 手工粘进公众号后台编辑器）。
#
# 可覆盖的 config（在 profile 的 cordis.patch.yml 里按 id: wechat-html 改）：
#   theme:        default | grace | simple
#   codeTheme:    github | github-dark | atom-one-light | atom-one-dark | vs | monokai
#   primaryColor: '#0F4C81'
#   fontFamily:   CSS 字体栈
#   fontSize:     '15px'
#   outputDir:    产物落盘目录；'' → 系统临时目录
#   legend:       图片说明文字 none | alt | title | alt-title | title-alt
- insert:
    - id: wechat-html
      name: 'dsh-wechat-html'
